<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="600" fill="#fcfcfb"/>

  <text x="600" y="36" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">Three Authorization Models</text>
  <text x="600" y="58" font-size="14" fill="#898781" text-anchor="middle">Not mutually exclusive — most mature implementations combine them (Section 3.2)</text>

  <line x1="405" y1="85" x2="405" y2="540" stroke="#e1e0d9" stroke-width="1.5"/>
  <line x1="795" y1="85" x2="795" y2="540" stroke="#e1e0d9" stroke-width="1.5"/>

  <!-- RBAC -->
  <text x="220" y="108" font-size="19" font-weight="700" fill="#2a78d6" text-anchor="middle">RBAC</text>
  <text x="220" y="128" font-size="12.5" fill="#52514e" text-anchor="middle">Role-Based Access Control</text>

  <rect x="60" y="165" width="110" height="46" rx="8" fill="#ffffff" stroke="#898781" stroke-width="2"/>
  <text x="115" y="193" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Subject</text>

  <line x1="170" y1="188" x2="203" y2="188" stroke="#52514e" stroke-width="1.75"/>
  <polygon points="207,188 198,183 198,193" fill="#52514e"/>

  <rect x="210" y="165" width="110" height="46" rx="8" fill="#eaf1fb" stroke="#2a78d6" stroke-width="2"/>
  <text x="265" y="193" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Role</text>

  <rect x="270" y="235" width="120" height="46" rx="8" fill="#ffffff" stroke="#898781" stroke-width="2"/>
  <text x="330" y="263" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Permission</text>

  <line x1="265" y1="211" x2="320" y2="240" stroke="#52514e" stroke-width="1.75"/>
  <polygon points="323,243 322,232 314,239" fill="#52514e"/>

  <text x="220" y="335" font-size="12.5" fill="#52514e" text-anchor="middle">Simple to reason about.</text>
  <text x="220" y="355" font-size="12.5" fill="#52514e" text-anchor="middle">Depends on "static pre-defined</text>
  <text x="220" y="373" font-size="12.5" fill="#52514e" text-anchor="middle">roles" that don't adjust to</text>
  <text x="220" y="391" font-size="12.5" fill="#52514e" text-anchor="middle">context (OMB, 2022).</text>
  <text x="220" y="425" font-size="11" fill="#898781" text-anchor="middle">Sandhu, Ferraiolo, Kuhn (2000)</text>

  <!-- ABAC -->
  <text x="600" y="108" font-size="19" font-weight="700" fill="#1baf7a" text-anchor="middle">ABAC</text>
  <text x="600" y="128" font-size="12.5" fill="#52514e" text-anchor="middle">Attribute-Based Access Control</text>

  <rect x="470" y="160" width="98" height="38" rx="7" fill="#eafaf3" stroke="#1baf7a" stroke-width="1.75"/>
  <text x="519" y="184" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Subject</text>
  <rect x="632" y="160" width="98" height="38" rx="7" fill="#eafaf3" stroke="#1baf7a" stroke-width="1.75"/>
  <text x="681" y="184" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Object</text>
  <rect x="470" y="210" width="98" height="38" rx="7" fill="#eafaf3" stroke="#1baf7a" stroke-width="1.75"/>
  <text x="519" y="234" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Action</text>
  <rect x="632" y="210" width="98" height="38" rx="7" fill="#eafaf3" stroke="#1baf7a" stroke-width="1.75"/>
  <text x="681" y="234" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Environment</text>

  <line x1="568" y1="179" x2="595" y2="200" stroke="#52514e" stroke-width="1.5"/>
  <line x1="632" y1="179" x2="605" y2="200" stroke="#52514e" stroke-width="1.5"/>
  <line x1="568" y1="229" x2="595" y2="208" stroke="#52514e" stroke-width="1.5"/>
  <line x1="632" y1="229" x2="605" y2="208" stroke="#52514e" stroke-width="1.5"/>

  <rect x="560" y="270" width="80" height="46" rx="23" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/>
  <text x="600" y="298" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Decision</text>
  <line x1="600" y1="248" x2="600" y2="267" stroke="#52514e" stroke-width="1.75"/>
  <polygon points="600,271 595,261 605,261" fill="#52514e"/>

  <text x="600" y="335" font-size="12.5" fill="#52514e" text-anchor="middle">Evaluated dynamically, at the</text>
  <text x="600" y="355" font-size="12.5" fill="#52514e" text-anchor="middle">moment of the request — not a</text>
  <text x="600" y="373" font-size="12.5" fill="#52514e" text-anchor="middle">role assigned once and left</text>
  <text x="600" y="391" font-size="12.5" fill="#52514e" text-anchor="middle">unexamined.</text>
  <text x="600" y="425" font-size="11" fill="#898781" text-anchor="middle">NIST SP 800-162 (2019)</text>

  <!-- ReBAC -->
  <text x="980" y="108" font-size="19" font-weight="700" fill="#eb6834" text-anchor="middle">ReBAC</text>
  <text x="980" y="128" font-size="12.5" fill="#52514e" text-anchor="middle">Relationship-Based Access Control</text>

  <circle cx="980" cy="185" r="34" fill="#fdece3" stroke="#eb6834" stroke-width="2"/>
  <text x="980" y="190" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">Doc</text>

  <circle cx="890" cy="270" r="34" fill="#ffffff" stroke="#898781" stroke-width="2"/>
  <text x="890" y="266" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">User</text>
  <text x="890" y="280" font-size="10" fill="#52514e" text-anchor="middle">(editor)</text>

  <circle cx="1070" cy="270" r="34" fill="#ffffff" stroke="#898781" stroke-width="2"/>
  <text x="1070" y="266" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">User</text>
  <text x="1070" y="280" font-size="10" fill="#52514e" text-anchor="middle">(commenter)</text>

  <line x1="957" y1="207" x2="911" y2="248" stroke="#52514e" stroke-width="1.75"/>
  <polygon points="908,251 916,244 907,240" fill="#52514e"/>
  <text x="905" y="222" font-size="10.5" fill="#52514e" text-anchor="middle">editor of</text>

  <line x1="1003" y1="207" x2="1049" y2="248" stroke="#52514e" stroke-width="1.75" stroke-dasharray="4,3"/>
  <polygon points="1052,251 1050,240 1041,247" fill="#52514e"/>
  <text x="1063" y="222" font-size="10.5" fill="#52514e" text-anchor="middle">implied</text>

  <text x="980" y="335" font-size="12.5" fill="#52514e" text-anchor="middle">Editor of a document is also its</text>
  <text x="980" y="355" font-size="12.5" fill="#52514e" text-anchor="middle">commenter. Powers Google's</text>
  <text x="980" y="373" font-size="12.5" fill="#52514e" text-anchor="middle">Zanzibar: trillions of relationships,</text>
  <text x="980" y="391" font-size="12.5" fill="#52514e" text-anchor="middle">sub-10ms p95 latency.</text>
  <text x="980" y="425" font-size="11" fill="#898781" text-anchor="middle">Pang et al. (2019)</text>

  <text x="600" y="500" font-size="12.5" fill="#52514e" text-anchor="middle">A mature implementation typically uses coarse-grained ABAC to decide who gets into an application at all,</text>
  <text x="600" y="518" font-size="12.5" fill="#52514e" text-anchor="middle">and finer-grained RBAC or ReBAC inside it to decide what they can do once there (OMB, 2022).</text>
</svg>
