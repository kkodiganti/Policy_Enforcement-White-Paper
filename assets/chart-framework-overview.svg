<svg viewBox="0 0 1200 540" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="540" fill="#fcfcfb"/>

  <text x="600" y="36" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">The Proposed Framework, at a Glance</text>
  <text x="600" y="58" font-size="14" fill="#898781" text-anchor="middle">Section 3.1 — three parts, plus a coverage discipline that extends the first</text>

  <!-- Pillar boxes -->
  <rect x="40" y="90" width="340" height="300" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <rect x="430" y="90" width="340" height="300" rx="12" fill="#ffffff" stroke="#1baf7a" stroke-width="2"/>
  <rect x="820" y="90" width="340" height="300" rx="12" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>

  <!-- Badges -->
  <circle cx="80" cy="130" r="22" fill="#2a78d6"/>
  <text x="80" y="137" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="470" cy="130" r="22" fill="#1baf7a"/>
  <text x="470" y="137" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="860" cy="130" r="22" fill="#eb6834"/>
  <text x="860" y="137" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>

  <text x="210" y="140" font-size="16.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Single Enforcement Point</text>
  <text x="600" y="140" font-size="16.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Continuous Evaluation</text>
  <text x="990" y="140" font-size="16.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Policy-as-Code, Named Owner</text>

  <!-- Pillar 1 icon: services -> hub PDP -->
  <rect x="90" y="192" width="60" height="26" rx="5" fill="#ffffff" stroke="#898781" stroke-width="1.5"/>
  <text x="120" y="209" font-size="10" fill="#52514e" text-anchor="middle">svc A</text>
  <rect x="90" y="228" width="60" height="26" rx="5" fill="#ffffff" stroke="#898781" stroke-width="1.5"/>
  <text x="120" y="245" font-size="10" fill="#52514e" text-anchor="middle">svc B</text>
  <rect x="90" y="264" width="60" height="26" rx="5" fill="#ffffff" stroke="#898781" stroke-width="1.5"/>
  <text x="120" y="281" font-size="10" fill="#52514e" text-anchor="middle">svc C</text>

  <circle cx="280" cy="245" r="36" fill="#eaf1fb" stroke="#2a78d6" stroke-width="2.25"/>
  <text x="280" y="251" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle">PDP</text>

  <line x1="152" y1="205" x2="238" y2="228" stroke="#52514e" stroke-width="1.5"/>
  <polygon points="242,230 233,225 232,234" fill="#52514e"/>
  <line x1="152" y1="241" x2="242" y2="245" stroke="#52514e" stroke-width="1.5"/>
  <polygon points="246,245 237,240 237,250" fill="#52514e"/>
  <line x1="152" y1="277" x2="238" y2="262" stroke="#52514e" stroke-width="1.5"/>
  <polygon points="242,260 233,259 236,268" fill="#52514e"/>

  <text x="210" y="325" font-size="12.5" fill="#52514e" text-anchor="middle">Every consuming system reaches</text>
  <text x="210" y="343" font-size="12.5" fill="#52514e" text-anchor="middle">policy through the same PDP —</text>
  <text x="210" y="361" font-size="12.5" fill="#52514e" text-anchor="middle">no copy rebuilt inside each service.</text>

  <!-- Pillar 2 icon: continuous timeline -->
  <text x="600" y="200" font-size="11" fill="#898781" text-anchor="middle">evaluated at every request, not once at login</text>
  <line x1="480" y1="240" x2="720" y2="240" stroke="#e1e0d9" stroke-width="3"/>
  <circle cx="500" cy="240" r="9" fill="#1baf7a"/>
  <circle cx="560" cy="240" r="9" fill="#1baf7a"/>
  <circle cx="620" cy="240" r="9" fill="#1baf7a"/>
  <circle cx="680" cy="240" r="9" fill="#1baf7a"/>
  <text x="500" y="268" font-size="10" fill="#52514e" text-anchor="middle">req 1</text>
  <text x="560" y="268" font-size="10" fill="#52514e" text-anchor="middle">req 2</text>
  <text x="620" y="268" font-size="10" fill="#52514e" text-anchor="middle">req 3</text>
  <text x="680" y="268" font-size="10" fill="#52514e" text-anchor="middle">req 4</text>

  <text x="600" y="325" font-size="12.5" fill="#52514e" text-anchor="middle">A role checked once at login and</text>
  <text x="600" y="343" font-size="12.5" fill="#52514e" text-anchor="middle">left untouched — or a review only</text>
  <text x="600" y="361" font-size="12.5" fill="#52514e" text-anchor="middle">after the fact — cannot satisfy this.</text>

  <!-- Pillar 3 icon: policy.yaml + owner -->
  <rect x="900" y="190" width="180" height="64" rx="8" fill="#fdece3" stroke="#eb6834" stroke-width="2"/>
  <text x="990" y="216" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">policy.yaml</text>
  <text x="990" y="235" font-size="10.5" fill="#52514e" text-anchor="middle">versioned, testable</text>
  <rect x="1040" y="182" width="36" height="20" rx="10" fill="#eb6834"/>
  <text x="1058" y="196" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">v14</text>

  <line x1="990" y1="254" x2="990" y2="272" stroke="#eb6834" stroke-width="1.75" stroke-dasharray="4,3"/>
  <polygon points="990,276 985,266 995,266" fill="#eb6834"/>

  <rect x="915" y="278" width="150" height="34" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/>
  <text x="990" y="299" font-size="11.5" fill="#0b0b0b" text-anchor="middle">Owner: named team</text>

  <text x="990" y="335" font-size="12.5" fill="#52514e" text-anchor="middle">Accountable for keeping the</text>
  <text x="990" y="353" font-size="12.5" fill="#52514e" text-anchor="middle">code aligned with what the</text>
  <text x="990" y="371" font-size="12.5" fill="#52514e" text-anchor="middle">written policy requires.</text>

  <!-- Coverage banner -->
  <rect x="40" y="440" width="1120" height="70" rx="10" fill="#f3f2ee" stroke="#e1e0d9" stroke-width="1.5"/>
  <text x="600" y="466" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">Coverage — a discipline, not a fourth mechanism</text>
  <text x="600" y="486" font-size="12.5" fill="#52514e" text-anchor="middle">Deliberately extending Part 1's single enforcement point to legacy systems and emergency-access paths</text>
  <text x="600" y="502" font-size="12.5" fill="#52514e" text-anchor="middle">that would otherwise be exempted by default.</text>

  <line x1="210" y1="410" x2="210" y2="437" stroke="#898781" stroke-width="1.75" stroke-dasharray="4,3"/>
  <polygon points="210,441 205,431 215,431" fill="#898781"/>
</svg>
