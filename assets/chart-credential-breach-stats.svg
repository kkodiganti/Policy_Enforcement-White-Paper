<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="420" fill="#fcfcfb"/>

  <text x="450" y="40" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">Credentials in the Breach Chain</text>
  <text x="450" y="64" font-size="14" fill="#898781" text-anchor="middle">Verizon Data Breach Investigations Report (2026)</text>

  <!-- Stat tile 1 -->
  <rect x="60" y="105" width="360" height="230" rx="14" fill="#eaf1fb" stroke="#2a78d6" stroke-width="2"/>
  <text x="240" y="225" font-size="72" font-weight="700" fill="#2a78d6" text-anchor="middle">28%</text>
  <text x="240" y="265" font-size="15" fill="#0b0b0b" text-anchor="middle">of breaches: credentials appear</text>
  <text x="240" y="286" font-size="15" fill="#0b0b0b" text-anchor="middle">as compromised data</text>

  <!-- Stat tile 2 -->
  <rect x="480" y="105" width="360" height="230" rx="14" fill="#eafaf3" stroke="#1baf7a" stroke-width="2"/>
  <text x="660" y="225" font-size="72" font-weight="700" fill="#1baf7a" text-anchor="middle">39%</text>
  <text x="660" y="265" font-size="15" fill="#0b0b0b" text-anchor="middle">of breaches: credentials remain</text>
  <text x="660" y="286" font-size="15" fill="#0b0b0b" text-anchor="middle">part of the attack chain overall</text>

  <text x="450" y="375" font-size="12.5" fill="#52514e" text-anchor="middle">This is the evidence base for Section 2.4 — attributes and entitlements an enforcement point relies on</text>
  <text x="450" y="393" font-size="12.5" fill="#52514e" text-anchor="middle">are frequently out of date, and credential-based access is where that shows up most in breach data.</text>
</svg>
