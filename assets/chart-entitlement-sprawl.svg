<svg viewBox="0 0 1120 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="420" fill="#fcfcfb"/>

  <text x="560" y="40" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">Entitlement Sprawl</text>
  <text x="560" y="64" font-size="14" fill="#898781" text-anchor="middle">Across the enterprises studied</text>

  <rect x="460" y="76" width="200" height="24" rx="12" fill="#fdece3" stroke="#eb6834" stroke-width="1.25"/>
  <text x="560" y="92" font-size="11" font-weight="700" fill="#eb6834" text-anchor="middle">VENDOR-REPORTED, ILLUSTRATIVE</text>

  <!-- Tile 1 -->
  <rect x="40" y="130" width="320" height="200" rx="14" fill="#ffffff" stroke="#eb6834" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="200" y="225" font-size="46" font-weight="700" fill="#eb6834" text-anchor="middle">96K–100K</text>
  <text x="200" y="260" font-size="14" fill="#0b0b0b" text-anchor="middle">average entitlements</text>
  <text x="200" y="280" font-size="14" fill="#0b0b0b" text-anchor="middle">per identity</text>

  <!-- Tile 2 -->
  <rect x="400" y="130" width="320" height="200" rx="14" fill="#ffffff" stroke="#eb6834" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="560" y="225" font-size="52" font-weight="700" fill="#eb6834" text-anchor="middle">38%</text>
  <text x="560" y="260" font-size="14" fill="#0b0b0b" text-anchor="middle">of accounts are</text>
  <text x="560" y="280" font-size="14" fill="#0b0b0b" text-anchor="middle">dormant</text>

  <!-- Tile 3 -->
  <rect x="760" y="130" width="320" height="200" rx="14" fill="#ffffff" stroke="#eb6834" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="920" y="225" font-size="46" font-weight="700" fill="#eb6834" text-anchor="middle">824,000</text>
  <text x="920" y="260" font-size="14" fill="#0b0b0b" text-anchor="middle">orphaned accounts,</text>
  <text x="920" y="280" font-size="14" fill="#0b0b0b" text-anchor="middle">no assigned human owner</text>

  <text x="560" y="370" font-size="12.5" fill="#52514e" text-anchor="middle">Veza (2025) — cross-referenced against the Verizon DBIR figures, but sample size undisclosed;</text>
  <text x="560" y="388" font-size="12.5" fill="#52514e" text-anchor="middle">read as illustrative of the pattern, not a precisely measured industry rate (Section 2.4).</text>
</svg>
